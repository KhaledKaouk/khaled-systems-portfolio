<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NetLab authorized clone and diagnostics workflow</title>
  <desc id="desc">A five-step Linux-native workflow from approved source through isolated clone, baseline snapshot, diagnostics, and report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091017"/><stop offset="1" stop-color="#111d27"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14232d"/><stop offset="1" stop-color="#0d171f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#83d6a3"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".16" stroke="#83d6a3"><path d="M0 170h1600M0 450h1600M0 730h1600"/><path d="M200 0v900M800 0v900M1400 0v900"/></g>
  <text x="100" y="115" fill="#83d6a3" font-family="ui-monospace,Consolas,monospace" font-size="22" letter-spacing="4">NETLAB / AUTHORIZED TEST ENVIRONMENT</text>
  <text x="100" y="170" fill="#e4edf4" font-family="Arial,sans-serif" font-size="54" font-weight="700">Clone safely. Diagnose repeatably.</text>
  <text x="100" y="212" fill="#90a1af" font-family="Arial,sans-serif" font-size="23">Linux-native CLI + MCP workflow · architecture visualization</text>
  <g stroke="#83d6a3" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M348 475h85"/><path d="M648 475h85"/><path d="M948 475h85"/><path d="M1248 475h85"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(70 330)"><rect width="280" height="290" rx="18" fill="url(#card)" stroke="#304451"/><circle cx="52" cy="55" r="25" fill="#173b2b"/><text x="52" y="64" text-anchor="middle" fill="#83d6a3" font-size="25" font-weight="700">1</text><text x="32" y="118" fill="#e4edf4" font-size="27" font-weight="700">Approved source</text><text x="32" y="160" fill="#90a1af" font-size="19">VM image · backup</text><text x="32" y="192" fill="#90a1af" font-size="19">or managed snapshot</text><rect x="32" y="228" width="184" height="32" rx="16" fill="#17262f"/><text x="48" y="250" fill="#83d6a3" font-size="15">PERMISSION CHECK</text></g>
    <g transform="translate(370 330)"><rect width="280" height="290" rx="18" fill="url(#card)" stroke="#304451"/><circle cx="52" cy="55" r="25" fill="#173b2b"/><text x="52" y="64" text-anchor="middle" fill="#83d6a3" font-size="25" font-weight="700">2</text><text x="32" y="118" fill="#e4edf4" font-size="27" font-weight="700">Isolated clone</text><text x="32" y="160" fill="#90a1af" font-size="19">Network boundaries</text><text x="32" y="192" fill="#90a1af" font-size="19">and secret scrubbing</text><rect x="32" y="228" width="146" height="32" rx="16" fill="#17262f"/><text x="48" y="250" fill="#83d6a3" font-size="15">NO PROD WRITES</text></g>
    <g transform="translate(670 330)"><rect width="280" height="290" rx="18" fill="url(#card)" stroke="#304451"/><circle cx="52" cy="55" r="25" fill="#173b2b"/><text x="52" y="64" text-anchor="middle" fill="#83d6a3" font-size="25" font-weight="700">3</text><text x="32" y="118" fill="#e4edf4" font-size="27" font-weight="700">Baseline</text><text x="32" y="160" fill="#90a1af" font-size="19">Snapshot before</text><text x="32" y="192" fill="#90a1af" font-size="19">controlled changes</text><rect x="32" y="228" width="131" height="32" rx="16" fill="#17262f"/><text x="48" y="250" fill="#83d6a3" font-size="15">RESETTABLE</text></g>
    <g transform="translate(970 330)"><rect width="280" height="290" rx="18" fill="url(#card)" stroke="#304451"/><circle cx="52" cy="55" r="25" fill="#173b2b"/><text x="52" y="64" text-anchor="middle" fill="#83d6a3" font-size="25" font-weight="700">4</text><text x="32" y="118" fill="#e4edf4" font-size="27" font-weight="700">Diagnostics</text><text x="32" y="160" fill="#90a1af" font-size="19">Approved tests via</text><text x="32" y="192" fill="#90a1af" font-size="19">CLI or MCP tools</text><rect x="32" y="228" width="150" height="32" rx="16" fill="#17262f"/><text x="48" y="250" fill="#83d6a3" font-size="15">AUDIT LOGGED</text></g>
    <g transform="translate(1270 330)"><rect width="280" height="290" rx="18" fill="url(#card)" stroke="#304451"/><circle cx="52" cy="55" r="25" fill="#173b2b"/><text x="52" y="64" text-anchor="middle" fill="#83d6a3" font-size="25" font-weight="700">5</text><text x="32" y="118" fill="#e4edf4" font-size="27" font-weight="700">Evidence report</text><text x="32" y="160" fill="#90a1af" font-size="19">Findings · changes</text><text x="32" y="192" fill="#90a1af" font-size="19">final-state snapshot</text><rect x="32" y="228" width="181" height="32" rx="16" fill="#17262f"/><text x="48" y="250" fill="#83d6a3" font-size="15">REPRODUCIBLE</text></g>
  </g>
  <g transform="translate(100 735)" font-family="ui-monospace,Consolas,monospace"><rect width="1400" height="82" rx="13" fill="#080d12" stroke="#283843"/><circle cx="35" cy="41" r="8" fill="#83d6a3"/><text x="60" y="48" fill="#cbd8e1" font-size="20">netlab run --source approved-snapshot --profile diagnostics --report ./evidence</text><text x="1250" y="48" fill="#83d6a3" font-size="18">SAFE BY DEFAULT</text></g>
</svg>
